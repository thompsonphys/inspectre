[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "inspectre"
version = "0.1.0"
description = "Effective source calculations for scalar particles in Kerr spacetime"
requires-python = ">=3.8"
dependencies = ["numpy"]

[tool.setuptools.packages.find]
include = ["inspectre*"]

[tool.setuptools]
py-modules = ["kerrgeodesics", "effsource_circular", "effsource_equatorial"]

[build-system]
requires = ["setuptools>=64", "wheel", "swig"]
build-backend = "setuptools.build_meta"

[project]
name = "inspectre"
version = "0.1.0"
description = "Effective source calculations for scalar particles in Kerr spacetime"
requires-python = ">=3.8"
dependencies = ["numpy", "scipy", "kerrgeodesics", "effsource"]

[tool.setuptools]
py-modules = ["inspectre_c"]

[tool.setuptools.packages.find]
include = ["inspectre"]

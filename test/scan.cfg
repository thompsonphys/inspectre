# inspectre source-integration parameter scan config
#
# Scans a grid of field points (rField, theta) and, at each point, compares the
# adaptive GSL QAG source amplitude against fixed-grid quadrature over a sweep of
# time resolutions N. Error is measured vs a high-accuracy QAG reference. Both
# accuracy and wall-time are recorded to `outfile` (CSV). Source component only.

# orbit
a       = 0.5
p       = 10.0
e       = 0.3
x       = 1.0
mMode   = 2
nMode   = 2

# field-point grid (inclusive endpoints; Count=1 uses the Min value)
rFieldMin   = 6.0
rFieldMax   = 16.0
rFieldCount = 10
thetaMin    = 1.49      # ~ pi/2 - 0.08
thetaMax    = 1.65      # ~ pi/2 + 0.08
thetaCount  = 6

# fixed-grid time-resolution sweep (powers of 2)
Nvalues = 128,256,512,1024,2048,4096,8192,16384

# adaptive QAG under test
epsabs = 1e-10
epsrel = 1e-9

# high-accuracy QAG ground truth
refEpsabs = 1e-13
refEpsrel = 1e-12

# fixed-grid methods to test against the reference (qag + qagmino always run).
# minospline = graded Mino-time mesh + spline (self-contained, uses N nodes).
methods = trap,simpson,spline,minospline,fft

# timing: each integration is repeated this many times; the min wall time is kept
repeats = 1

# CSV output path
outfile = data/scan_e0.3_a0.5_n15.csv

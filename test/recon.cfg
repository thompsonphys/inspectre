# recontest config: n-mode round-trip reconstruction accuracy.
#
# At each field point we compute n-mode amplitudes A_n with each integrator,
# sum them back to the time domain, and compare against the directly-evaluated
# source. Error vs nMax shows integrator accuracy + spectral truncation.
#
# IMPORTANT -- choose the field point relative to the orbit:
#   For p=10, e=0.3 the particle's radial range is r in [periastron, apastron]
#   = [p/(1+e), p/(1-e)] = [7.69, 14.29]. A field point INSIDE that range is
#   physically crossed by the particle, so S_m(t) is near-singular: the Fourier
#   spectrum decays slowly (Gibbs-like), no integrator reconstructs it well at
#   modest nMax, and the near-singular oscillatory integrand makes adaptive QAG
#   extremely slow (it subdivides to its limit for every high-|n| mode).
#   A field point OUTSIDE the range gives a smooth source: the spectrum decays
#   fast, every integrator converges, and QAG is cheap. The default grid below
#   sits outside the orbit so the run is fast and the convergence is meaningful.
#
# COST: qag/qagmino do one adaptive integration per |n| (12 components each) and
#   minospline does minoSamples source evals per |n|, so cost ~ #points * nMaxMax
#   * (#methods). A single smooth point with nMax up to 32 and all four methods
#   is ~minutes. Keep the grid small, or drop the heavy methods, when sweeping.

# orbit
a = 0.5
p = 10.0
e = 0.3
x = 1.0
mMode = 2

# field-point grid (rField, theta). Default sits OUTSIDE the radial range
# [7.69, 14.29] so the source is smooth and the test converges (see note above).
rFieldMin = 9.0
rFieldMax = 9.0
rFieldCount = 1
thetaMin = 1.5697963267948967   # pi/2 - 1e-3
thetaMax = 1.5697963267948967   # pi/2 - 1e-3
thetaCount = 1

# truncation sweep: reconstruct summing |n| <= nMax for each value
nMaxValues = 4, 8, 16, 32, 64

# integrator tolerances (qag / qagmino)
epsabs = 1e-12
epsrel = 1e-11

# number of uniform-t reconstruction samples over [0, Tr)
nRecon = 8192

# nodes for the minospline integrator (per n-mode amplitude)
minoSamples = 2048

# fft grid size; auto-bumped to >= 2*max(nMax)+2 if too small
fftN = 2048

# which integrators: subset of
#   qag,qagmino,minospline,fft,trapezoid,minotrap,minosimpson
# trapezoid: trapezoid on the dense uniform-t source samples (cheap fft alternative).
# minotrap / minosimpson: trapezoid / Simpson on the SAME graded Mino-time mesh as
#   minospline (non-uniform node times, no spline) -- tests whether a plain rule on
#   the graded mesh competes with the spline quadrature. Reuse the mesh build, so
#   they add no source evals.
methods = qag, qagmino, minospline, fft, trapezoid, minotrap, minosimpson

# 1 = also dump per-time-point recon-vs-direct curves to tsfile
dumpTimeseries = 1

# 1 = dump the minospline graded-mesh node geometry + raw source (meshfile), to
# visualize adaptive node clustering near closest approach vs the dense uniform-t
# source. 1 = dump a dense eval of the cubic spline through those nodes (splinefile)
# for a true-vs-interpolant comparison. splineDense = points in the dense eval.
dumpMesh = 1
dumpSpline = 1
splineDense = 2048

outfile = data/recon.csv
tsfile = data/recon_timeseries.csv
meshfile = data/recon_mesh.csv
splinefile = data/recon_spline.csv
